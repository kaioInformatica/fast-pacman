<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Pac-Man</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<button id="settingsButton" type="button" aria-label="Configurar labirinto" aria-controls="settingsModal">⚙</button>

<button id="scorePanelButton" type="button" aria-label="Abrir recordes" aria-controls="scorePanel">←</button>

<aside id="scorePanel" class="score-panel" aria-label="Histórico de pontuações">
    <h2>Recordes</h2>
    <label for="scoreDimension">Labirinto</label>
    <select id="scoreDimension"></select>
    <ol id="scoreHistory" class="score-history"></ol>
</aside>

<div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <section class="modal-content">
        <button id="closeSettingsButton" class="close-button" type="button" aria-label="Fechar configurações">×</button>
        <h1 id="settingsTitle">Configurar labirinto</h1>
        <p>Escolha as dimensões do próximo labirinto.</p>

        <fieldset class="origin-options">
            <legend>Origem do labirinto</legend>
            <label class="origin-option">
                <input type="radio" name="mazeOrigin" value="mathematical" checked>
                <span>
                    <strong>Matemática</strong>
                    <small>Gera o labirinto com as funções atuais.</small>
                </span>
            </label>
            <label class="origin-option">
                <input type="radio" name="mazeOrigin" value="ai">
                <span>
                    <strong>IA</strong>
                    <small>Gera um labirinto a partir de uma instrução sua.</small>
                </span>
            </label>
        </fieldset>

        <label for="rowsSlider">Linhas: <output id="rowsValue">9</output></label>
        <input id="rowsSlider" type="range" min="9" max="19" step="2" value="9">

        <label for="columnsSlider">Colunas: <output id="columnsValue">21</output></label>
        <input id="columnsSlider" type="range" min="15" max="31" step="2" value="21">

        <div id="aiOptions" class="ai-options hidden">
            <label for="aiPrompt">Prompt para a IA</label>
            <textarea id="aiPrompt" rows="14">Crie um labirinto de Pac-Man rico, estratégico e desafiador, com exatamente {{LINHAS}} linhas e {{COLUNAS}} colunas.

Responda somente com a matriz do labirinto: uma linha de texto por linha da grade, sem explicações, títulos ou blocos de código. Use exclusivamente # para paredes e . para caminhos com bolinhas.

Regras obrigatórias:
- A borda externa inteira deve ser formada por #.
- A posição inicial do Pac-Man é (1, 1) e deve conter um caminho (.).
- Toda célula de caminho deve ser alcançável a partir da posição inicial; não crie áreas isoladas.
- Respeite rigorosamente a quantidade solicitada de linhas e colunas em cada linha da matriz.

Priorize um cenário mais interessante que um labirinto matemático simples: combine rotas alternativas, cruzamentos com decisões, corredores estreitos, becos sem saída, circuitos, atalhos de risco e algumas áreas abertas. Distribua esses elementos de forma equilibrada e adaptada às dimensões solicitadas, mantendo uma progressão de desafio justa e uma navegação sempre possível.</textarea>
            <p class="ai-hint">Dois cenários locais por dimensão foram pré-gerados com este prompt. O jogo selecionará um deles para o tamanho escolhido (9–19 linhas e 15–31 colunas).</p>
        </div>

        <button id="applySettingsButton" class="apply-button" type="button">Criar labirinto</button>
    </section>
</div>

<div id="score">
    <span>Pontos: <span id="pontos">0</span></span>
    <span>Tempo: <span id="tempo">00:00:0</span></span>
</div>


<div id="game">

    <img id="pacman" src="assets/pacman.gif">

</div>



<script src="labirintos.js"></script>
<script src="pontuacoes.js"></script>
<script src="pacman-controller.js"></script>
<script src="script.js"></script>

</body>

</html>
